# The deploy workflow waits for this workflow by name, and branch protection
# requires the check run named "ci". That name is the aggregator job below.
# Add matrix jobs by making "ci" need them; do not rename the aggregator.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HUSKY: "0"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: actionlint
        run: |
          set -euo pipefail
          curl -sSLf -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color

      - name: Deployer shell tests
        run: bash infrastructure/deploy/deploy.test.sh

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Base SHA
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              echo "sha=" >> "$GITHUB_OUTPUT"
            else
              echo "sha=$before" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Lint and typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          base="${{ steps.base.outputs.sha }}"
          if [ -n "$base" ]; then
            pnpm turbo run lint typecheck --filter="...[$base]"
          else
            pnpm turbo run lint typecheck
          fi

      - name: Test affected packages
        run: bash infrastructure/deploy/ci-test.sh "${{ steps.base.outputs.sha }}"

  ci:
    name: ci
    needs: [verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require verify to succeed
        run: |
          result="${{ needs.verify.result }}"
          echo "verify result: ${result}"
          test "$result" = "success"
