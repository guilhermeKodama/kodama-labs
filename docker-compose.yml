name: kodama-prod

networks:
  kodama:
    external: true

# "always" (not "unless-stopped") so services come back after a reboot even if
# they were manually stopped beforehand — the host must converge to "stack up"
# on every boot (see infrastructure/systemd/kodama-labs.service).
x-restart: &restart
  restart: always

services:
  # ── careers ─────────────────────────────────────────────────────────────
  careers-migrate:
    build: { context: ., dockerfile: Dockerfile, target: careers, args: { NEXT_PUBLIC_APP_URL: "${CAREERS_APP_URL:-https://careers.kodamalabs.ai}", NEXT_PUBLIC_VAPID_PUBLIC_KEY: "BKQd4fNvNY4Q7IA-teiYts6qi7rFRzBmjcJhQUjqXoRdsmbJh6y4AgGERaeGFQXsgV5oYXbASXGPxtogrxo69AE" } }
    image: kodama-careers:latest
    env_file: apps/careers/.env.production
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    networks: [kodama]

  careers-web:
    <<: *restart
    image: kodama-careers:latest
    depends_on: { careers-migrate: { condition: service_completed_successfully } }
    env_file: apps/careers/.env.production
    environment:
      APP_URL: "${CAREERS_APP_URL:-https://careers.kodamalabs.ai}"
    ports: ["${CAREERS_WEB_PORT:-3006}:3006"]
    volumes:
      - /home/kodama/.local/share/careers/blob:/home/kodama/.local/share/careers/blob
    networks: [kodama]

  careers-jobs:
    <<: *restart
    image: kodama-careers:latest
    depends_on: { careers-migrate: { condition: service_completed_successfully } }
    env_file: apps/careers/.env.production
    environment:
      APP_URL: "${CAREERS_APP_URL:-https://careers.kodamalabs.ai}"
    command: ["pnpm", "run", "worker:jobs"]
    volumes:
      - /home/kodama/.local/share/careers/blob:/home/kodama/.local/share/careers/blob
    networks: [kodama]

  careers-sources:
    <<: *restart
    image: kodama-careers:latest
    depends_on: { careers-migrate: { condition: service_completed_successfully } }
    env_file: apps/careers/.env.production
    command: ["pnpm", "run", "worker:sources"]
    networks: [kodama]

  careers-maintenance:
    <<: *restart
    image: kodama-careers:latest
    depends_on: { careers-migrate: { condition: service_completed_successfully } }
    env_file: apps/careers/.env.production
    environment:
      APP_URL: "${CAREERS_APP_URL:-https://careers.kodamalabs.ai}"
    command: ["pnpm", "run", "worker:maintenance"]
    volumes:
      - /home/kodama/.local/share/careers/blob:/home/kodama/.local/share/careers/blob
    networks: [kodama]

  # ── attention ───────────────────────────────────────────────────────────
  attention-migrate:
    build: { context: ., dockerfile: Dockerfile, target: attention, args: { NEXT_PUBLIC_APP_URL: "${ATTENTION_APP_URL:-https://attentio.dev}", NEXT_PUBLIC_VAPID_PUBLIC_KEY: "BNc3iQ75zEEvAk1rsm56R8pc01BDQUb0ax4JYrtWcBvnxmek6HjHlxJ57Bfjfc6xRo7gX8cPRU0MvlrpPEQszmg" } }
    image: kodama-attention:latest
    env_file: apps/attention/.env.production
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    networks: [kodama]

  attention-web:
    <<: *restart
    image: kodama-attention:latest
    depends_on: { attention-migrate: { condition: service_completed_successfully } }
    env_file: apps/attention/.env.production
    ports: ["${ATTENTION_WEB_PORT:-3005}:3005"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [kodama]

  attention-whatsapp:
    <<: *restart
    image: kodama-attention:latest
    depends_on: { attention-migrate: { condition: service_completed_successfully } }
    env_file: apps/attention/.env.production
    command: ["node", "dist/worker-whatsapp.mjs"]
    volumes:
      - /home/kodama/.local/share/attention/baileys-auth:/home/kodama/.local/share/attention/baileys-auth
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [kodama]

  attention-maintenance:
    <<: *restart
    image: kodama-attention:latest
    depends_on: { attention-migrate: { condition: service_completed_successfully } }
    env_file: apps/attention/.env.production
    command: ["pnpm", "run", "worker:maintenance"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [kodama]

  attention-jobs:
    <<: *restart
    image: kodama-attention:latest
    depends_on: { attention-migrate: { condition: service_completed_successfully } }
    env_file: apps/attention/.env.production
    command: ["pnpm", "run", "worker:jobs"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [kodama]

  # ── capital ─────────────────────────────────────────────────────────────
  capital-migrate:
    build: { context: ., dockerfile: Dockerfile, target: capital, args: { NEXT_PUBLIC_APP_URL: "${CAPITAL_PUBLIC_URL:-https://capital.kodamalabs.ai}", NEXT_PUBLIC_VAPID_PUBLIC_KEY: "BIZPytT1AcEzKXA5YQRz6V7tso9r_1uFeSfAuDhTLOotQ3_p8aIwOJwTKaEBWpG9xCSfUobWA2k00AumltvwztE" } }
    image: kodama-capital:latest
    env_file: apps/capital/.env.production
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    networks: [kodama]

  capital-web:
    <<: *restart
    image: kodama-capital:latest
    depends_on: { capital-migrate: { condition: service_completed_successfully } }
    env_file: apps/capital/.env.production
    environment:
      APP_URL: "${CAPITAL_PUBLIC_URL:-https://capital.kodamalabs.ai}"
    ports: ["${CAPITAL_WEB_PORT:-3000}:3000"]
    volumes:
      - ${HOME}/.local/share/capital/blob:/home/kodama/.local/share/capital/blob
    networks: [kodama]

  # ── sentinel ────────────────────────────────────────────────────────────
  sentinel-migrate:
    build: { context: ., dockerfile: Dockerfile, target: sentinel, args: { NEXT_PUBLIC_APP_URL: "${SENTINEL_PUBLIC_URL:-https://sentinel.kodamalabs.ai}" } }
    image: kodama-sentinel:latest
    env_file: apps/sentinel/.env.production
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    networks: [kodama]

  sentinel-web:
    <<: *restart
    image: kodama-sentinel:latest
    depends_on: { sentinel-migrate: { condition: service_completed_successfully } }
    env_file: apps/sentinel/.env.production
    environment:
      APP_URL: "${SENTINEL_PUBLIC_URL:-https://sentinel.kodamalabs.ai}"
      SENTINEL_BLOB_DIR: /home/kodama/.local/share/sentinel/blob
    ports: ["${SENTINEL_WEB_PORT:-3002}:3002"]
    volumes:
      - /home/kodama/.local/share/sentinel/blob:/home/kodama/.local/share/sentinel/blob
    networks: [kodama]

  # ── kodamalabs ──────────────────────────────────────────────────────────
  # Marketing site. No database. Public host is chosen at DNS cutover;
  # the tunnel config lists kodamalabs.ai and www.
  kodamalabs-web:
    <<: *restart
    build: { context: ., dockerfile: Dockerfile, target: kodamalabs }
    image: kodama-kodamalabs:latest
    ports: ["${KODAMALABS_WEB_PORT:-13003}:3003"]
    networks: [kodama]

  # ── ingress / cron ──────────────────────────────────────────────────────
  cloudflared:
    <<: *restart
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--config", "/etc/cloudflared-config/config.yml", "run", "attention"]
    volumes:
      - /home/kodama/.cloudflared:/etc/cloudflared:ro
      - ./infrastructure/cloudflared/config.yml:/etc/cloudflared-config/config.yml:ro
    networks: [kodama]

  # Reuses the capital image (full workspace already installed) — no separate
  # build target. Requires capital/sentinel secrets to exist (see runbook
  # Fase 5-6); comes up with the rest of the stack on `compose up -d`.
  cronjobs:
    <<: *restart
    image: kodama-capital:latest
    working_dir: /repo/infrastructure/cronjobs
    command: ["pnpm", "run", "start"]
    env_file: infrastructure/cronjobs/.env.production
    environment:
      CAPITAL_BASE_URL: http://capital-web:3000
      SENTINEL_BASE_URL: http://sentinel-web:3002
      CRON_APPS: "${CRON_APPS:-capital,sentinel}"
      KUMA_PUSH_BASE_URL: http://uptime-kuma:3001
      KUMA_PUSH_TOKEN_FILE: /var/kodama-monitoring/push-tokens.json
    volumes:
      - ${HOME}/.local/share/capital/blob:/home/kodama/.local/share/capital/blob
      - ./infrastructure/cronjobs/schedules:/repo/infrastructure/cronjobs/schedules:ro
      - /home/kodama/.local/share/kodama-monitoring:/var/kodama-monitoring:ro
    networks: [kodama]

  # ── monitoring ──────────────────────────────────────────────────────────
  # Kuma is bound to loopback only and is not in the cloudflared ingress.
  # The one-shot provisioner intentionally has no restart policy: it exits 0,
  # and `restart: always` would run it forever. Migrate services are the same.
  docker-socket-proxy:
    <<: *restart
    # Docker Hub publishes v0.4.2, not 0.4.2.
    image: tecnativa/docker-socket-proxy:v0.4.2
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      INFO: "1"
      PING: "1"
      VERSION: "1"
      POST: "0"
    volumes:
      - /home/kodama/.docker/desktop/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m
    networks: [kodama]

  uptime-kuma:
    <<: *restart
    image: louislam/uptime-kuma:2.5.3-slim
    depends_on:
      docker-socket-proxy:
        condition: service_started
    # Slim has no embedded MariaDB. Without this, a fresh data dir stays on
    # the setup-database page and never opens the socket the provisioner uses.
    environment:
      UPTIME_KUMA_DB_TYPE: sqlite
    ports:
      - "127.0.0.1:${UPTIME_KUMA_PORT:-13020}:3001"
    volumes:
      - /home/kodama/.local/share/uptime-kuma:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 384m
    networks: [kodama]

  uptime-kuma-provision:
    image: kodama-monitoring:latest
    build:
      context: .
      dockerfile: infrastructure/monitoring/Dockerfile
    command: ["node", "dist/provision.js"]
    depends_on:
      uptime-kuma:
        condition: service_healthy
    env_file:
      - path: infrastructure/monitoring/.env.production
        required: false
    environment:
      KUMA_URL: http://uptime-kuma:3001
      DOCKER_DAEMON: tcp://docker-socket-proxy:2375
      DOCKER_TYPE: tcp
      COMPOSE_PROJECT_NAME: kodama-prod
      CRON_SCHEDULES_DIR: /app/schedules
      PUSH_TOKEN_FILE: /var/kodama-monitoring/push-tokens.json
    volumes:
      - /home/kodama/.local/share/kodama-monitoring:/var/kodama-monitoring
    mem_limit: 256m
    networks: [kodama]
    restart: "no"

  log-watcher:
    <<: *restart
    image: kodama-monitoring:latest
    command: ["node", "dist/watch.js"]
    depends_on:
      docker-socket-proxy:
        condition: service_started
    env_file:
      - path: infrastructure/monitoring/.env.production
        required: false
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      COMPOSE_PROJECT_NAME: kodama-prod
      WATCH_HOST: kodama-ai
    mem_limit: 128m
    networks: [kodama]
