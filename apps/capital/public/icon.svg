<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Capital app icon: a coin, straight on. Near-black #0B0B0C field,
    metallic gold #C9A227 outer ring and letter, soft gold #E6C976
    inner ring. Flat two-tone only — no gradient.

    Outer ring outer diameter 600, stroke 45. Inner ring stroke 18,
    with a 46px groove (the field showing through) between the rings.
    The C is Geist Bold (weight 700) at cap height 280, converted to a
    path so the file does not depend on a font.

    The groove and inner stroke are heavier than the nominal 18/14.
    At those widths the groove antialiases away below about 60px and
    the two rings fuse into one circle, which reads as a copyright
    mark. Gold on near-black needs a wider groove than white did:
    46/18 still leaves two dark pixels of field between the rings at 48px.

    Reeded ticks are omitted. Ticks small enough to stay subtle
    disappear at 48px; ticks large enough to survive read as a gear.
  -->
  <title>Capital</title>
  <rect width="1024" height="1024" fill="#0B0B0C"/>
  <circle cx="512" cy="512" r="277.5" fill="none" stroke="#C9A227" stroke-width="45"/>
  <circle cx="512" cy="512" r="200" fill="none" stroke="#E6C976" stroke-width="18"/>
  <path fill="#C9A227" d="M514.17 658.31 Q475.92 658.31 446.34 640.96 Q416.76 623.61 399.80 590.87 Q382.85 558.14 382.85 512.39 Q382.85 467.83 399.21 434.90 Q415.58 401.97 445.35 383.83 Q475.13 365.69 515.35 365.69 Q570.17 365.69 600.54 392.70 Q630.90 419.72 639.97 469.80 L577.66 472.17 Q572.93 445.75 557.15 430.96 Q541.38 416.17 515.35 416.17 Q481.83 416.17 463.30 442.39 Q444.76 468.62 444.76 512.39 Q444.76 556.56 463.69 582.20 Q482.62 607.83 514.96 607.83 Q542.96 607.83 558.73 591.86 Q574.51 575.89 578.45 547.49 L641.15 549.86 Q632.48 601.13 600.73 629.72 Q568.99 658.31 514.17 658.31 Z"/>
</svg>
