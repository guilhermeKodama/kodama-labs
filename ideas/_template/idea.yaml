# {{IDEA_NAME}} — pipeline dashboard config
# Machine-readable mirror of validation.md §5/§7. Prose stays in validation.md;
# this file is what the dashboard syncs (no idea.yaml = idea not tracked).
# Ratios are FRACTIONS: 0.015 = 1.5%. Money values are BRL.
schema_version: 1
name: "{{IDEA_NAME}}"
status: hypothesis # hypothesis | validating | validated | killed | paused
landing_url: null # set when the LP deploys; required to promote to validating
timezone: America/Sao_Paulo

budget:
  total: 2500 # R$ — match validation.md §5
  weeks: 3

economics:
  price_monthly: null # null while free beta
  projected_ltv: 500 # TODO: your 12-month LTV (ticket × frequency × retention × margin)
  max_cac: 125 # TODO: LTV/4 rule — blended kill ceiling
  cac_ceiling_per_lead: 50 # TODO: validation ceiling per qualified lead (CPL kill line)
  channel_kill_cac: 150 # TODO: kill a single channel above this

decision_matrix: # 2D: CAC (R$) × Lead→Active — keep in sync with validation.md §5
  - { cac_max: 40, ar_min: 0.70, decision: double_down }
  - { cac_max: 80, ar_min: 0.50, decision: optimize }
  - { cac_max: 125, ar_min: 0.30, decision: hold_fix }
  - { decision: kill }

funnel_targets: # healthy / death pairs — defaults from the one-pager template
  ctr: { healthy: 0.015, death: 0.005 }
  ctr_google: { healthy: 0.03, death: 0.01 }
  bounce: { healthy: 0.60, death: 0.80 }
  session_to_lead: { healthy: 0.05, death: 0.01 }
  ar: { healthy: 0.60, death: 0.30 }
  pcr: { healthy: 0.30, death: 0.10 }

gates: # validation.md §7 — metric items auto-evaluate; manual items are a checklist
  go:
    - { metric: session_to_lead, op: gt, value: 0.05 }
  pivot: []
  kill:
    - { metric: session_to_lead, op: lt, value: 0.01, label: "after 2 creative iterations" }

ads:
  meta_ad_account_id: null # act_XXXXXXXXXX — create with timezone America/Sao_Paulo + BRL
  google_customer_id: null # 10 digits, no dashes (shared account under the MCC)
  google_campaign_prefix: "{{IDEA_SLUG}}" # campaign names must start with this

tracking:
  ga4_property_id: null # numeric property id (Admin → Property Settings), NOT G-XXXX

ads_launched_at: null # YYYY-MM-DD; starts the 72h learning clock + day-28 countdown
go_no_go_at: null # defaults to launch + 28d in the dashboard when null
