services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: wallex
      POSTGRES_MULTIPLE_DATABASES: capital,sentinel,attention,careers
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    shm_size: '2g'
    deploy:
      resources:
        limits:
          memory: 8g
    networks:
      default: {}
      kodama: {}

volumes:
  postgres_data:

networks:
  kodama:
    external: true
