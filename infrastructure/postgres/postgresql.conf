# Tuned for 60GB RAM development machine
listen_addresses = '*'
shared_buffers = 4GB
effective_cache_size = 16GB
work_mem = 64MB
maintenance_work_mem = 512MB
wal_buffers = 64MB

# Write-ahead log (faster writes, acceptable risk for dev)
synchronous_commit = off
wal_level = minimal
max_wal_senders = 0
checkpoint_completion_target = 0.9
max_wal_size = 2GB

# Parallelism
max_worker_processes = 8
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
