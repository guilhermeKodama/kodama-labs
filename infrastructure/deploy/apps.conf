# Sourced by lib.sh. This is the deploy graph for kodama-prod.
# Prefixes with no slash match a single repo-root file. Prefixes with a
# slash match that path and everything under it.

unit_order=(monitoring kodamalabs careers attention sentinel capital cronjobs cloudflared)

# image: build on the native engine, load into desktop-linux, then migrate.
# recreate: no image of its own (cronjobs uses the capital image; cloudflared is upstream).
declare -A UNIT_KIND=(
  [monitoring]=image
  [kodamalabs]=image
  [careers]=image
  [attention]=image
  [sentinel]=image
  [capital]=image
  [cronjobs]=recreate
  [cloudflared]=recreate
)

declare -A UNIT_IMAGE=(
  [monitoring]=kodama-monitoring
  [kodamalabs]=kodama-kodamalabs
  [careers]=kodama-careers
  [attention]=kodama-attention
  [sentinel]=kodama-sentinel
  [capital]=kodama-capital
  [cronjobs]=kodama-capital
  [cloudflared]=cloudflare/cloudflared:latest
)

declare -A UNIT_DOCKERFILE=(
  [monitoring]=infrastructure/monitoring/Dockerfile
  [kodamalabs]=Dockerfile
  [careers]=Dockerfile
  [attention]=Dockerfile
  [sentinel]=Dockerfile
  [capital]=Dockerfile
)

declare -A UNIT_TARGET=(
  [kodamalabs]=kodamalabs
  [careers]=careers
  [attention]=attention
  [sentinel]=sentinel
  [capital]=capital
)

# Long-running services recreated after a successful migrate (or immediately
# for units without a database). Migrate one-shots are UNIT_MIGRATE.
declare -A UNIT_SERVICES=(
  [monitoring]="log-watcher"
  [kodamalabs]="kodamalabs-web"
  [careers]="careers-web careers-jobs careers-sources careers-maintenance"
  [attention]="attention-web attention-whatsapp attention-maintenance attention-jobs"
  [sentinel]="sentinel-web"
  [capital]="capital-web"
  [cronjobs]="cronjobs"
  [cloudflared]="cloudflared"
)

declare -A UNIT_MIGRATE=(
  [careers]=careers-migrate
  [attention]=attention-migrate
  [sentinel]=sentinel-migrate
  [capital]=capital-migrate
)

declare -A UNIT_DATABASE=(
  [careers]=careers
  [attention]=attention
  [sentinel]=sentinel
  [capital]=capital
)

# Port inside the container network, not the published host port.
declare -A UNIT_PORT=(
  [kodamalabs]=3003
  [careers]=3006
  [attention]=3005
  [sentinel]=3002
  [capital]=3000
)

# Expected "db" field from GET /api/health.
declare -A UNIT_SMOKE_DB=(
  [kodamalabs]=skipped
  [careers]=ok
  [attention]=ok
  [sentinel]=ok
  [capital]=ok
)

# Extra work after a successful image rollout.
declare -A UNIT_ALSO_RECREATE=(
  [capital]=cronjobs
)

# path|action|units
# action is build, recreate, or warn. build implies the unit's full pipeline.
PATH_RULES=(
  "apps/kodamalabs|build|kodamalabs"
  "apps/careers|build|careers"
  "apps/attention|build|attention"
  "apps/sentinel|build|sentinel"
  "apps/capital|build|capital"
  "packages/storage|build|careers,sentinel,capital"
  "packages/typescript-config|build|kodamalabs,careers,attention,sentinel,capital"
  "package.json|build|kodamalabs,careers,attention,sentinel,capital,monitoring"
  "pnpm-lock.yaml|build|kodamalabs,careers,attention,sentinel,capital,monitoring"
  "pnpm-workspace.yaml|build|kodamalabs,careers,attention,sentinel,capital,monitoring"
  "Dockerfile|build|kodamalabs,careers,attention,sentinel,capital"
  "infrastructure/cronjobs/src|build|capital"
  "infrastructure/cronjobs/package.json|build|capital"
  "infrastructure/cronjobs/schedules|recreate|cronjobs"
  "infrastructure/cronjobs/schedules|build|monitoring"
  "infrastructure/monitoring|build|monitoring"
  "infrastructure/cloudflared|recreate|cloudflared"
  "infrastructure/postgres|warn|postgres"
)
